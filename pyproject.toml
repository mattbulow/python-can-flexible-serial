[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "python-can-flexible-serial"
version = "0.1.0"
description = "python-can interface plugin for a configurable binary serial CAN protocol"
readme = "README.md"
keywords = ["can", "python-can", "serial", "plugin"]
requires-python = ">=3.12"
dependencies = [
    "python-can>=4.4,<5",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
"python-can plugin interface" = "https://python-can.readthedocs.io/en/stable/plugin-interface.html"

[project.entry-points."can.interface"]
flexible_serial = "flexible_serial.bus:FlexibleSerial"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
